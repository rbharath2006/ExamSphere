spring:
  application:
    name: online-examination-system

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/online_exam_db}
    username: ${DB_USERNAME:exam_app}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8080