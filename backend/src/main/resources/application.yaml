spring:
  application:
    name: online-examination-system

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/online_exam_db}
    username: ${DB_USERNAME:exam_app}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax