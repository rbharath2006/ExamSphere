# Application Configuration
spring:
  application:
    name: online-examination-system

  # PostgreSQL Database Configuration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/online_exam_db}
    username: ${DB_USERNAME:exam_app}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: none

    show-sql: true
    open-in-view: false

    properties:
      hibernate:
        format_sql: true

# Server Configuration
server:
  port: 8080